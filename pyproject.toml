[project]
name = "tic-tac-toe"
version = "0.1.0"
description = "3D Tic-Tac-Toe desktop game with isometric renderer and AI opponent"
requires-python = ">=3.10"
dependencies = [
    "pygame>=2.6",
]

[project.scripts]
tic-tac-toe = "main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--tb=short"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.coverage.run]
source = ["src"]
omit = ["tests/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.8",
]
